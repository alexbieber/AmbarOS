# Ambar OS: the bootloader packages are already part of the installed system
# (grub-efi-amd64-signed, shim-signed), so there is nothing to fetch from the
# installation medium. Kubuntu's version installs them from an apt repository
# on the ISO, which Ambar's ISO doesn't carry. Just check they're there.
---
firmwareType:
    bios:    "-/bin/true"
    "*":
        -    command: dpkg -s grub-efi-amd64-signed shim-signed
             timeout: 30
