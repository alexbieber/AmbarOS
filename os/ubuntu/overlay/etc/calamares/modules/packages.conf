---
# Cleans the live-session tools out of the installed system and adds language packs.
# try_remove: a package that isn't in this image is skipped instead of failing the install
# (Kubuntu's list names kubuntu-installer-prompt, which Ambar OS doesn't ship).
update_db: true
ignore_update_db_error: true
backend: apt
operations:
  - try_remove:
      - "^live-*"
      - calamares-settings-kubuntu
      - calamares-settings-ubuntu-common
      - calamares-settings-ubuntu-common-data
      - calamares
      - calamares-data
      - libcalamaresui3.3
      - cifs-utils
      - kubuntu-installer-prompt
  - try_install:
      - language-pack-$LOCALE
      - language-pack-gnome-$LOCALE
      - language-pack-kde-$LOCALE
      - hunspell-$LOCALE
      - libreoffice-help-$LOCALE
      - libreoffice-l10n-$LOCALE
