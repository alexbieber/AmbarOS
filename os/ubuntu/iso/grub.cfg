# Ambar OS @VERSION@ live / installer USB
set timeout=8
set default=0
insmod all_video
insmod gfxterm
insmod png
search --no-floppy --set=root --file /casper/vmlinuz
if loadfont unicode; then set gfxmode=auto; terminal_output gfxterm; fi
if background_image /boot/grub/background.png; then true; fi
set color_normal=light-gray/black
set color_highlight=black/yellow
set menu_color_normal=light-gray/black
set menu_color_highlight=black/yellow

menuentry "Try or Install Ambar OS" {
    linux /casper/vmlinuz boot=casper quiet splash console=ttyS0,115200n8 console=tty0 ---
    initrd /casper/initrd
}
menuentry "Try or Install Ambar OS (safe graphics)" {
    linux /casper/vmlinuz boot=casper nomodeset quiet splash console=ttyS0,115200n8 console=tty0 ---
    initrd /casper/initrd
}
menuentry "Try Ambar OS in memory (toram)" {
    linux /casper/vmlinuz boot=casper toram quiet splash console=ttyS0,115200n8 console=tty0 ---
    initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
menuentry "UEFI firmware settings" { fwsetup }
fi
