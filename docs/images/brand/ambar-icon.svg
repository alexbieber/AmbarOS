<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ambar OS" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Ambar OS</title>
  <defs>
    <linearGradient id="amb-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1612"/>
      <stop offset="1" stop-color="#07080C"/>
    </linearGradient>
    <linearGradient id="amb-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC03A"/>
      <stop offset="1" stop-color="#FCA101"/>
    </linearGradient>
    <linearGradient id="amb-fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B84800" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B84800" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amb-left" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F57A0C"/>
      <stop offset="1" stop-color="#E25F04"/>
    </linearGradient>
    </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#amb-tile)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g transform="translate(96 141)">
