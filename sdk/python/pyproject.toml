[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ambar-sdk"
version = "0.1.0"
description = "Python SDK for Ambar OS: talk to ambard as the owner or as a scoped agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ambar Singh" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["ambar_sdk"]
