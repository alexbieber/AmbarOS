# Ambar Security tool catalogue
#
# One list for every security tool Ambar can install, organised the way Kali
# organises them (tiers and menu categories), but each tool comes from the most
# modern source available:
#
#   apt     Ubuntu 26.04 package: security updates arrive with normal updates
#   pipx    Python tool in its own virtual environment (PyPI name or git URL)
#   github  single static binary from the project's GitHub releases, installed
#           only if its SHA-256 matches the checksums file the release publishes
#   kali    package from Kali rolling, inside an isolated distrobox container
#
# Tiers mirror Kali's metapackages:
#   top10    = kali-tools-top10
#   default  = kali-linux-default (what Kali's normal ISO ships) + modern tools
#   large    = default + kali-linux-large inside the Kali container
#   everything = default + kali-linux-everything inside the Kali container
#
# Fields: name (what you run), cat (menu category), tier, src, pkg (package,
# pip spec or owner/repo; defaults to name), bin (commands, default [name]),
# gui (a desktop app), replaces (older tools it supersedes), deps (Ubuntu
# packages a pipx or github tool needs to build or run), about.

[categories]
information-gathering = "Information Gathering"
vulnerability-analysis = "Vulnerability Analysis"
web = "Web Application Analysis"
database = "Database Assessment"
passwords = "Password Attacks"
wireless = "Wireless Attacks"
reverse-engineering = "Reverse Engineering"
exploitation = "Exploitation Tools"
sniffing-spoofing = "Sniffing & Spoofing"
post-exploitation = "Post Exploitation"
forensics = "Forensics"
reporting = "Reporting Tools"
social-engineering = "Social Engineering Tools"
support = "Supporting Tools"

[tiers]
top10 = "Kali's top 10 tools"
default = "Everything in Kali's default ISO, with modern replacements"
large = "Default + Kali's large set (in the Kali container)"
everything = "Default + every Kali tool (in the Kali container)"

[kali]
image = "docker.io/kalilinux/kali-rolling:latest"
container = "ambar-kali"
large = "kali-linux-large"
everything = "kali-linux-everything"

# Network services the tool set brings in (directly or as dependencies: sslh
# pulls in the SSH server). Kali leaves them off until you start them, and so
# does Ambar: ambar-sec turns off the ones an install switched on (.service and
# .socket), and never touches a service you had enabled yourself.
[services]
disable = ["apache2", "mariadb", "mysql", "smbd", "nmbd", "samba-ad-dc", "snmpd", "atftpd",
           "inetsim", "miredo", "sslh", "stunnel4", "iodined", "redsocks", "openvpn", "ssh",
           "nginx", "postgresql", "xinetd", "tftpd-hpa", "dnsmasq"]

[[tool]]
name = "nmap"
cat = "information-gathering"
tier = "top10"
src = "apt"
about = "Network discovery and port scanning"

[[tool]]
name = "wireshark"
cat = "sniffing-spoofing"
tier = "top10"
src = "apt"
gui = true
about = "Network protocol analyser"

[[tool]]
name = "aircrack-ng"
cat = "wireless"
tier = "top10"
src = "apt"
bin = ["aircrack-ng", "airodump-ng", "aireplay-ng", "airmon-ng"]
about = "Wi-Fi security auditing suite"

[[tool]]
name = "hydra"
cat = "passwords"
tier = "top10"
src = "apt"
about = "Online login brute-forcing for many protocols"

[[tool]]
name = "john"
cat = "passwords"
tier = "top10"
src = "apt"
about = "John the Ripper password cracker"

[[tool]]
name = "sqlmap"
cat = "database"
tier = "top10"
src = "apt"
about = "Automatic SQL injection detection and exploitation"

[[tool]]
name = "netexec"
cat = "exploitation"
tier = "top10"
src = "pipx"
pkg = "git+https://github.com/Pennyw0rth/NetExec"
deps = ["gcc", "python3-dev"]  # netifaces and arc4 have no wheels for Python 3.14 yet
bin = ["netexec", "nxc"]
replaces = ["crackmapexec"]
about = "Network service execution and AD assessment (maintained successor of CrackMapExec)"

[[tool]]
