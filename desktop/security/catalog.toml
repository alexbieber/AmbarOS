cat = "post-exploitation"
tier = "default"
src = "apt"
about = "Encrypted netcat clone"

# --- Forensics -----------------------------------------------------------------

[[tool]]
name = "autopsy"
cat = "forensics"
tier = "default"
src = "apt"
about = "Digital forensics platform (web UI)"

[[tool]]
name = "sleuthkit"
cat = "forensics"
tier = "default"
src = "apt"
bin = ["fls", "mmls", "icat"]
about = "File-system forensics"

[[tool]]
name = "volatility3"
cat = "forensics"
tier = "default"
src = "pipx"
bin = ["vol"]
replaces = ["volatility (2)"]
about = "Memory forensics"

[[tool]]
name = "guymager"
cat = "forensics"
tier = "default"
src = "apt"
gui = true
about = "Forensic disk imaging"

[[tool]]
name = "bulk-extractor"
cat = "forensics"
tier = "default"
src = "kali"
pkg = "bulk-extractor"
bin = ["bulk_extractor"]
about = "Extract features from disk images"

[[tool]]
name = "foremost"
cat = "forensics"
tier = "default"
src = "apt"
about = "File carving"

[[tool]]
name = "scalpel"
cat = "forensics"
tier = "default"
src = "apt"
about = "File carving"

[[tool]]
name = "testdisk"
cat = "forensics"
tier = "default"
src = "apt"
bin = ["testdisk", "photorec"]
about = "Partition and file recovery"

[[tool]]
name = "magicrescue"
cat = "forensics"
tier = "default"
src = "apt"
about = "File recovery by magic bytes"

[[tool]]
name = "hashdeep"
cat = "forensics"
tier = "default"
src = "apt"
about = "Recursive hashing and audit"

[[tool]]
name = "exiftool"
cat = "forensics"
tier = "default"
src = "apt"
pkg = "libimage-exiftool-perl"
about = "Read and write file metadata"

[[tool]]
name = "yara"
cat = "forensics"
tier = "default"
src = "apt"
about = "Pattern matching for malware research"

[[tool]]
name = "pdfid"
cat = "forensics"
tier = "default"
src = "kali"
about = "Triage PDF files (the PyPI package installs no command)"

# --- Reporting -----------------------------------------------------------------

[[tool]]
name = "faraday"
cat = "reporting"
tier = "default"
src = "kali"
pkg = "faraday"
bin = ["faraday-manage"]
about = "Collaborative pentest reporting"

[[tool]]
name = "pipal"
cat = "reporting"
tier = "default"
src = "kali"
about = "Password statistics"

# --- Supporting tools (what Kali's default set also installs) ------------------
# Services among these are installed but left off (see [services]).

[[tool]]
name = "support-utilities"
cat = "support"
tier = "default"
src = "apt"
pkg = "7zip axel bind9-dnsutils exiv2 i2c-tools rfkill scrounge-ntfs cifs-utils clang dos2unix ethtool expect gdisk git iw minicom netmask ncurses-hexedit pipx plocate python3-pip python3-virtualenv screen smbclient swaks sendemail tcpick telnet tftp-hpa traceroute unrar vim whois xxd arping ifenslave netsed udptunnel vlan vpnc openvpn redsocks stunnel4 sslh ssldump miredo php php-mysql rake"
bin = []
about = "Shell, network, archive and scripting utilities Kali includes"

[[tool]]
name = "lab-servers"
cat = "support"
tier = "default"
src = "apt"
pkg = "apache2 default-mysql-server samba samba-common-bin snmpd atftpd"
bin = []
about = "Servers for labs and file transfer, installed but not started"

[[tool]]
name = "impacket-scripts"
cat = "exploitation"
tier = "default"
src = "apt"
pkg = "python3-impacket"
bin = []
about = "Impacket as a system Python library (the pipx 'impacket' entry provides the scripts)"

[[tool]]
name = "kali-extras"
cat = "support"
tier = "default"
src = "kali"
pkg = "binwalk3 cryptcat dbd exe2hexbat gpp-decrypt hashcat-utils hydra-gtk legion msfpc multimac passing-the-hash pdf-parser powershell pwnat qsslcaudit rebind rsmangler sakis3g snmpcheck thc-pptp-bruter unix-privesc-check voiphopper"
bin = ["binwalk3", "cryptcat", "gpp-decrypt", "legion", "msfpc", "pdf-parser", "pwsh", "rsmangler", "snmpcheck", "unix-privesc-check"]
about = "The rest of Kali's default set: older or niche tools, kept in the Kali container"

# Kali default packages Ambar deliberately leaves out, with the reason.
[excluded]
cryptsetup = "already part of Ambar OS (disk encryption in the installer)"
cryptsetup-initramfs = "already part of Ambar OS; changes the boot process"
cryptsetup-nuke-password = "Kali-specific boot change; not something to install with a toolkit"
vboot-kernel-utils = "Chromebook kernel signing; Kali hardware support, not a security tool"
vboot-utils = "Chromebook firmware utilities; Kali hardware support, not a security tool"
hotpatch = "obsolete Windows binary patcher, unmaintained since 2012"
