<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="Ambar OS" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Ambar OS</title>
  <defs>
    <linearGradient id="amb-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC03A"/>
      <stop offset="1" stop-color="#FCA101"/>
    </linearGradient>
    <linearGradient id="amb-fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B84800" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B84800" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amb-left" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F57A0C"/>
      <stop offset="1" stop-color="#E25F04"/>
    </linearGradient>
  </defs>
  <!-- right ribbon: rounded apex, runs down to the right -->
  <path fill="url(#amb-right)"
