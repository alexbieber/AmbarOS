name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - name: Validate launchd / systemd unit files
        shell: bash
        run: |
          U="$RUNNER_TEMP/units"; mkdir -p "$U"
          printf '#!/bin/sh\n' > "$U/ambard"; chmod +x "$U/ambard"
          AMBAR_DUMP_UNITS="$U" cargo test -p ambar-service --lib dump_units --locked
          if [ "$RUNNER_OS" = "macOS" ]; then
            plutil -lint "$U/os.ambar.ambard.plist"
          else
            out=$(systemd-analyze verify --man=no "$U/ambard.service" 2>&1); echo "$out"
            [ -z "$out" ]  # systemd-analyze exits 0 even on warnings
          fi

  python:
    name: Python, desktop, OS recipe and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 desktop-file-utils shellcheck
      - run: pip install "PySide6-Essentials>=6.6" pytest pyyaml "mkdocs-material==9.8.1"
      - run: cargo build --workspace --locked
      - run: QT_QPA_PLATFORM=offscreen AMBAR_SCREENSHOTS=screenshots python -m pytest -q sdk/python/tests desktop os/tests tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-center-screenshots
          path: screenshots/

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
