name: Ambar OS ISO

# Builds the Ambar OS live/installer ISOs (Ubuntu 26.04 LTS + KDE Plasma 6,
# macOS-style desktop, Firefox from Mozilla's repository): the standard edition and
# the Security edition (Kali's default tool set), boots each in QEMU/KVM,
# runs the boot test over the serial console and keeps the ISO, the boot log
# and screenshots of the booted desktop as artifacts.

on:
  push:
    branches: [main]
    paths: ["os/ubuntu/**", "desktop/**", "crates/**", "sdk/**", "marketplace/**", ".github/workflows/os-ubuntu.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        flavor: [standard, security]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Ambar binaries
        run: cargo build --release --locked --bin ambar --bin ambard --bin ambar-recon
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-efi-amd64-bin grub-pc-bin mtools \
            dosfstools qemu-system-x86 ovmf
      - name: Build the ISO
        run: sudo BROWSER=firefox FLAVOR=${{ matrix.flavor }} WORK=/mnt/ambar-build OUT="$PWD/output/ubuntu" os/ubuntu/build.sh all
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo chown -R "$USER" output
      - name: Boot the ISO and test it
        run: |
          iso=$(ls output/ubuntu/ambar-os-*-amd64.iso)
          echo "testing $iso"
          os/ubuntu/test-qemu.sh "$iso"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ambar-os-${{ matrix.flavor }}-boot-evidence
          path: output/ubuntu/boot/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ambar-os-${{ matrix.flavor }}-iso
          path: |
            output/ubuntu/ambar-os-*-amd64.iso
            output/ubuntu/ambar-os-*-amd64.iso.sha256
          retention-days: 14
          compression-level: 0
