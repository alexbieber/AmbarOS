[workspace]
resolver = "3"
members = [
    "crates/ambar-automation",
    "crates/ambar-service",
    "crates/ambar-ai",
    "crates/ambar-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/alexbieber/AmbarOS"
authors = ["Ambar Singh"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
croner = "4.0"
getrandom = "0.4"
globset = "0.4"
humantime = "2.4"
notify = "8"
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "system-proxy"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "net", "io-util"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
wiremock = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
